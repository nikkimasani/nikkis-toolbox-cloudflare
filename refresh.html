<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="theme-color" content="#0b0b10">
<title>Toolbox Cache Cleared</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b10;color:#f2f0eb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:34rem;text-align:center;padding:32px}h1{font-size:1.6rem;margin:0 0 12px}p{color:#9b9baa;line-height:1.6;margin:0}.done{color:#69e0c3}
</style>
</head>
<body>
<main><h1 id="status">Refreshing your toolbox…</h1><p id="message">Please keep this page open for a moment.</p></main>
<script>
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration => registration.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(key => caches.delete(key)));
    }
    document.getElementById('status').textContent = 'Refresh complete';
    document.getElementById('status').className = 'done';
    document.getElementById('message').textContent = 'Close this tab completely, then reopen your Cloudflare toolbox.';
  } catch (error) {
    document.getElementById('status').textContent = 'Refresh needs one more step';
    document.getElementById('message').textContent = 'Close every Cloudflare toolbox tab, then open this refresh page again.';
  }
})();
</script>
</body>
</html>
