<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="theme-color" content="#0b0b10">
<title>Refreshing Nikki's Toolbox</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b10;color:#f2f0eb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{text-align:center;padding:32px}h1{font-size:1.5rem;margin:0 0 10px}p{color:#9b9baa;margin:0}
</style>
</head>
<body>
<main><h1>Refreshing your toolbox…</h1><p>The updated Said and Done card will appear next.</p></main>
<script>
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration => registration.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(key => caches.delete(key)));
    }
  } finally {
    window.location.replace('/?updated=said-and-done-20260903');
  }
})();
</script>
</body>
</html>
